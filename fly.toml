# fly.toml - Fly.io configuration for ThetaMac
# See https://fly.io/docs/reference/configuration/ for reference

app = "thetamac"  # Change this to your actual app name
primary_region = "sjc"  # San Jose - change to your preferred region

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1  # Keep at least 1 machine running for WebSocket connections

  # Important: Enable sticky sessions for WebSocket connections
  # This ensures Socket.io clients always connect to the same instance
  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

# Health checks
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

# Machine configuration
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# For WebSocket support, ensure connections are properly handled
[processes]
  app = "npx tsx server.ts"
