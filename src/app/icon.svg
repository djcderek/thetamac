<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ThetaMac">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="64" cy="64" r="58" fill="url(#g)"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Theta mark -->
  <g filter="url(#s)">
    <circle cx="64" cy="64" r="30" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <line x1="44" y1="64" x2="84" y2="64" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>


